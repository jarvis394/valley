# The whole Valley stack. `docker compose up -d postgres s3` runs only the services the dev
# servers need; `docker compose up -d --build` runs everything. Settings come from .env.
name: valley

x-app: &app
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-valley}:${POSTGRES_PASSWORD:-valley}@postgres:5432/${POSTGRES_DB:-valley}
    S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://s3:8333}
    LOCAL_STORAGE_ROOT: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    migrate:
      condition: service_completed_successfully
    s3:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valley}
      POSTGRES_DB: ${POSTGRES_DB:-valley}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage, the default STORAGE_DRIVER. Creates S3_BUCKET on start.
  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: mini -dir=/data -bucket=${S3_BUCKET:-valley}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-valley}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-valley-secret}
    volumes:
      - s3:/data
    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-valley}:${POSTGRES_PASSWORD:-valley}@postgres:5432/${POSTGRES_DB:-valley}
    depends_on:
      postgres:
        condition: service_healthy

  # The editor.
  web:
    <<: *app
    build:
      context: .
      target: web
      args:
        GALLERY_SERVICE_URL: ${GALLERY_SERVICE_URL:-http://localhost:3001}
    environment:
      <<: *app-env
      GALLERY_SERVICE_URL: ${GALLERY_SERVICE_URL:-http://localhost:3001}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      VALLEY_SIGNUP_MODE: ${VALLEY_SIGNUP_MODE:-invite}
    ports:
      - ${WEB_PORT:-3000}:3000

  # Public galleries and the portfolio, e.g. gallery.yekushev.dev.
  gallery:
    <<: *app
    build:
      context: .
      target: gallery
    ports:
      - ${GALLERY_PORT:-3001}:3000

  # Static copy of the published galleries in ./export:
  # `docker compose run --rm export` or, for one gallery, `... export --slug <slug>`.
  export:
    <<: *app
    profiles: [export]
    restart: 'no'
    build:
      context: .
      target: source
    working_dir: /app/apps/gallery
    entrypoint: [bun, scripts/export.ts, --out, /export]
    command: []
    volumes:
      - ./export:/export

volumes:
  postgres:
  s3:
  storage:
